name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a draft release (e.g. 0.1.0); empty for a build only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm make wget unzip

      - name: Install ps5-payload-sdk
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q -d /opt ps5-payload-sdk.zip
          ls /opt/ps5-payload-sdk

      - name: Build
        run: make PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk

      - uses: actions/upload-artifact@v4
        with:
          name: retailframegen
          path: retailframegen.elf

      - name: Draft release
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" retailframegen.elf --draft --target "$GITHUB_SHA" \
            --title "RetailFrameGen $VERSION" \
            --notes "RetailFrameGen $VERSION, step 1: logs how a retail game shows its frames (display buffers, flips, flip rate, graphics submits) to /data/retailframegen/log.txt. No frames are generated yet.

          Send retailframegen.elf to the ELF loader (port 9021), then start the game within two minutes. See the README for details."
